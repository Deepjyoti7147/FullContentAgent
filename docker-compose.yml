version: "3.9"

services:
  fullcontent-agent:
    build:
      context: .
      dockerfile: Dockerfile
    image: fullcontent-agent:latest
    restart: unless-stopped
    env_file: .env

    # ── Resource limits ───────────────────────────
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "512M"
        reservations:
          memory: "128M"

    # Health monitoring
    healthcheck:
      test: ["CMD", "python", "-c", "import psycopg2"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 30s

    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
